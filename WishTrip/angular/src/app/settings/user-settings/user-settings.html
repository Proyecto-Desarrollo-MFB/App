<div class="settings-container py-5">
  <div class="container">
    <div class="settings-box shadow">
      
      <div class="d-flex justify-content-start mb-3">
        <a [routerLink]="['/perfil', currentUserInfo?.userName]" class="btn btn-dark text-white rounded-pill px-4 shadow-sm">
          <i class="fa fa-arrow-left me-2"></i> Volver
        </a>
      </div>

      <h2 class="title-header text-center">SETTINGS</h2>
      
      <div class="tabs-header">
        <button class="tab-btn" [class.active]="activeTab === 'social'" (click)="setTab('social')">profile/social</button>
        <button class="tab-btn" [class.active]="activeTab === 'seguridad'" (click)="setTab('seguridad')">seguridad</button>
      </div>

      <div class="tab-content py-4" *ngIf="activeTab === 'social'">
        <div class="alert alert-success" *ngIf="mensajeSocial">{{ mensajeSocial }}</div>
        
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label text-dark">Nombre de usuario</label>
            <input type="text" class="form-control" [(ngModel)]="editData.userName">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label text-dark">Nombre completo</label>
            <input type="text" class="form-control" [(ngModel)]="editData.name">
          </div>
          
          <div class="col-md-12 mb-3">
            <label class="form-label text-dark">Foto de Perfil (Avatar)</label>
            <div class="d-flex align-items-center gap-3">
                <input type="file" class="form-control" accept="image/*" (change)="onFileSelected($event)" #fileInput>
                <button *ngIf="editData.avatarUrl" type="button" class="btn btn-outline-secondary btn-sm" (click)="removeAvatar()">
                    <i class="fa fa-times me-1"></i> Quitar
                </button>
            </div>

            <div class="mt-3 d-flex align-items-center gap-3">
                <div>
                    <p class="text-muted mb-1" style="font-size: 0.85rem;">Vista previa:</p>
                    <img [src]="editData.avatarUrl || 'https://api.dicebear.com/7.x/pixel-art/svg?seed=' + editData.userName" 
                         alt="Avatar Preview" 
                         class="rounded-circle shadow-sm border" 
                         style="width: 80px; height: 80px; object-fit: cover; background-color: #f8f9fa;">
                </div>
                <div *ngIf="!editData.avatarUrl" class="text-muted" style="font-size: 0.8rem; max-width: 250px;">
                    Se usará tu avatar estilo <b>Pixel Art</b> predeterminado.
                </div>
            </div>
          </div>

          <div class="col-md-12 mb-4 mt-2">
            <label class="form-label text-dark">Biografía</label>
            <textarea class="form-control" rows="4" [(ngModel)]="editData.bio"></textarea>
          </div>
        </div>
        
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-primary px-4" (click)="saveSocial()">Guardar cambios</button>
          <button class="btn btn-danger px-4 fw-bold" (click)="logout()">Salir</button>
        </div>
      </div>

      <div class="tab-content py-4" *ngIf="activeTab === 'seguridad'">
        <div class="alert alert-info" *ngIf="mensajeSeguridad || mensajeEmail">{{ mensajeSeguridad || mensajeEmail }}</div>
        
        <h5 class="text-dark mb-3 border-bottom pb-2">Actualizar Correo Electrónico</h5>
        <div class="row align-items-end mb-5">
            <div class="col-md-8 mb-3 mb-md-0">
                <input type="email" class="form-control" [(ngModel)]="editData.email">
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" (click)="saveEmail()">Actualizar correo</button>
            </div>
        </div>

        <h5 class="text-dark mb-3 border-bottom pb-2">Cambiar Contraseña</h5>
        <div class="mb-3">
          <label class="form-label text-dark">Contraseña Actual</label>
          <input type="password" class="form-control" [(ngModel)]="passData.currentPassword">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="password" class="form-control" [(ngModel)]="passData.newPassword" placeholder="Nueva Contraseña">
          </div>
          <div class="col-md-6 mb-4">
            <input type="password" class="form-control" [(ngModel)]="passData.confirmPassword" placeholder="Confirmar Contraseña">
          </div>
        </div>
        <button class="btn btn-primary px-4" (click)="changePassword()">Actualizar contraseña</button>

        <div class="danger-zone mt-5 p-4 border border-danger rounded">
            <h5 class="text-danger mb-2">Zona de Peligro</h5>
            <button class="btn btn-outline-danger" (click)="deleteAccount()"><i class="fa fa-trash"></i> Eliminar Cuenta</button>
        </div>
      </div>
    </div>
  </div>
</div>
