<div class="card">
  <div class="card-header">
    <h5 class="card-title">🔍 Buscar Ciudades</h5>
  </div>
  <div class="card-body">
    
    <div class="mb-3">
      <label class="form-label">Ingrese el nombre de la ciudad:</label>
      <input 
        type="text" 
        class="form-control" 
        placeholder="Ej: Paris, Buenos Aires..." 
        #searchInput
        (keyup)="onSearch(searchInput.value)" 
      />
      <div class="form-text">Escriba al menos 3 letras para buscar.</div>
    </div>

    <div *ngIf="loading" class="text-center my-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p>Buscando en GeoDB...</p>
    </div>

    <div *ngIf="!loading && ciudades.length > 0" class="list-group mt-3">
      <a href="javascript:void(0)" class="list-group-item list-group-item-action" *ngFor="let ciudad of ciudades">
        <div class="d-flex w-100 justify-content-between">
          <h6 class="mb-1">{{ ciudad.nombre }}</h6>
          <small class="text-muted">🌎 {{ ciudad.pais }}</small>
        </div>
      </a>
    </div>

    <div *ngIf="!loading && ciudades.length === 0 && searchInput.value.length > 2" class="alert alert-warning mt-3">
      No se encontraron ciudades con ese nombre.
    </div>

  </div>
</div>
