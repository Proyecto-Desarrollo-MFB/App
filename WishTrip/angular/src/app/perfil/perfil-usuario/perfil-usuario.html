<div class="perfil-container text-white" style="min-height: 100vh; background-color: #14181c; padding-top: 50px;">
    
    <div class="container py-5">
        
        <div class="mb-5 d-flex flex-wrap gap-3 justify-content-between align-items-center">
            
            <a routerLink="/" class="btn btn-outline-light rounded-pill px-4 shadow-sm">
                <i class="fa fa-arrow-left me-2"></i> Volver al Home
            </a>

            <div class="input-group" style="max-width: 350px;">
                <span class="input-group-text bg-dark border-secondary text-white-50">&#64;</span>
                <input type="text" 
                       class="form-control bg-dark text-white border-secondary" 
                       placeholder="Buscar usuario..." 
                       [(ngModel)]="searchUsername" 
                       (keyup.enter)="buscarUsuario()">
                <button class="btn btn-primary px-3 fw-bold" (click)="buscarUsuario()">
                    Buscar
                </button>
            </div>

        </div>

        <div *ngIf="!userProfile && !usuarioNoEncontrado" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 text-white-50">Buscando perfil...</p>
        </div>

        <div *ngIf="usuarioNoEncontrado" class="text-center py-5 mt-5">
            <h4 class="text-white-50 fw-normal">Usuario no encontrado</h4>
        </div>

        <div *ngIf="userProfile && !usuarioNoEncontrado">
            
            <div class="row mb-5 align-items-center">
                <div class="col-auto">
                    <img [src]="userProfile?.avatarUrl || 'https://i.pravatar.cc/150'" alt="Avatar" class="rounded-circle shadow" style="width: 120px; height: 120px; object-fit: cover; border: 2px solid #333;">
                </div>
                <div class="col">
                    <h2 class="fw-bold mb-1 d-flex align-items-center gap-2">
                        {{ userProfile?.userName || 'usuario' }}
                        <span class="badge bg-warning text-dark" style="font-size: 0.6rem; letter-spacing: 1px;">PRO</span>
                    </h2>
                    <p class="text-white-50 mb-3">{{ userProfile?.bio || 'Sin biografía' }}</p>
                    
                    <a routerLink="/settings" class="btn btn-outline-light btn-sm px-3 rounded-pill" *ngIf="isMyProfile">
                        <i class="fa fa-edit me-1"></i> Editar Perfil
                    </a>
                </div>
                <div class="col-auto text-center d-flex gap-4">
                    <div>
                        <h3 class="fw-bold mb-0">12</h3>
                        <small class="text-white-50 text-uppercase" style="letter-spacing: 2px; font-size: 0.7rem;">Destinos</small>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">45</h3>
                        <small class="text-white-50 text-uppercase" style="letter-spacing: 2px; font-size: 0.7rem;">Reviews</small>
                    </div>
                </div>
            </div>

            <hr class="border-secondary mb-5">

            <h6 class="text-white-50 text-uppercase mb-4" style="letter-spacing: 2px;">Destinos Favoritos</h6>
            
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div class="col">
                    <div class="card bg-dark text-white border-0 shadow-sm overflow-hidden" style="border-radius: 12px; aspect-ratio: 4/3;">
                        <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a" class="card-img w-100 h-100" style="object-fit: cover; opacity: 0.8;" alt="Destino">
                    </div>
                </div>
                <div class="col">
                    <div class="card bg-dark text-white border-0 shadow-sm overflow-hidden" style="border-radius: 12px; aspect-ratio: 4/3;">
                        <img src="https://images.unsplash.com/photo-1513622470522-26c3c8a854bc" class="card-img w-100 h-100" style="object-fit: cover; opacity: 0.8;" alt="Destino">
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>
