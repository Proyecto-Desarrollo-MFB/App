<div class="wishlist-page" style="min-height: 100vh; background-color: #14181c; color: white;">
  <div class="container py-5">
    
    <div class="mb-5">
      <h2 class="fw-bold d-flex align-items-center gap-3">
        <i class="fa fa-clock-o" style="color: #00c030;"></i>
        <span>Mi Wishlist</span>
      </h2>
      <p class="text-white-50">Ciudades que tenés planeado visitar próximamente.</p>
    </div>

    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div *ngIf="!isLoading && wishlist.length === 0" class="text-center py-5 rounded border border-secondary" style="background: #1c2228;">
      <i class="fa fa-map-o mb-3 text-white-50" style="font-size: 3rem;"></i>
      <h5 class="text-white-50 fw-normal">Tu wishlist está vacía.</h5>
      <p class="text-muted small mb-0">¡Explorá destinos y marcá el reloj para guardarlos acá!</p>
    </div>

    <div *ngIf="!isLoading && wishlist.length > 0" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-4">
      <div class="col" *ngFor="let wish of wishlist">
        
        <div class="wish-card position-relative rounded overflow-hidden shadow" 
             (click)="irADetalle(wish)"
             style="background: #1c2228; aspect-ratio: 2/3; cursor: pointer; border: 1px solid #2d3848; transition: transform 0.2s ease;">
          
          <button class="position-absolute top-0 end-0 m-2" 
                  style="background: rgba(0, 0, 0, 0.6); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; z-index: 10;"
                  (click)="quitarDeWishlist(wish, $event)">
            <i class="fa fa-times"></i>
          </button>

          <div style="width: 100%; height: 100%;">
            <img [src]="wish.destinationImageUrl || 'https://placehold.co/300x450/222/FFF?text=Cargando...'" 
                 class="w-100 h-100" style="object-fit: cover;" alt="{{ wish.destinationName }}">
          </div>

          <div class="position-absolute bottom-0 w-100 p-2 text-center" 
               style="background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 100%);">
            <div class="fw-bold text-truncate" style="font-size: 0.95rem;">{{ wish.destinationName }}</div>
            <div class="text-white-50 text-truncate small" style="font-size: 0.8rem;">{{ wish.destinationPais }}</div>
          </div>

        </div>

      </div>
    </div>

  </div>
</div>
